[versions]
agp = "8.13.2"
appcompat = "1.7.1"
material = "1.13.0"
# Newest version (currently 4.0.0) is not supported by rust android_activity 0.6.0 - needs
# to wait until the (hopefully) next rust android_activity version to use here the latest version.
gamesActivity = "4.0.0"

[libraries]
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
games-activity = { group = "androidx.games", name = "games-activity", version.ref = "gamesActivity" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }

